name: squeeze_pix
description: "An App To Compress Large and Bulky Images and Share Instanly."

publish_to: "none"

version: 3.1.29

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3
  get_storage: ^2.1.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1 # Add this line
  share_plus: ^12.0.1
  flutter_image_compress: ^2.5.1
  flutter_staggered_animations: ^1.1.1
  open_filex: ^4.7.0
  archive: ^4.0.9
  unity_ads_plugin: ^0.4.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0
  before_after: ^3.2.0
  file_picker: ^11.0.2
  file_saver: ^0.3.1
  permission_handler: ^12.0.3
  google_fonts: ^8.2.0
  in_app_purchase: ^3.3.0
  in_app_review: ^2.0.9
  shimmer: ^3.0.0
  image_cropper: ^12.2.1
  gal: ^2.3.3
  pdf: ^3.11.3
  flutter_colorpicker: ^1.1.0
  image: ^4.8.0
  http: ^1.6.0
  # flutter_document_picker: ^5.4.1
  # google_mobile_ads: ^6.0.0
  # open_file_plus: ^3.4.1+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sq_pix_logo_new.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/gifs/
    - assets/templates/
